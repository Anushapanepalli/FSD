<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Thumbnail Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .gallery {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .gallery a img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 2px solid #444;
            border-radius: 5px;
            transition: transform 0.2s ease;
        }
        .gallery a img:hover {
            transform: scale(1.1);
            border-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Image Gallery with Thumbnails</h1>
    <p>Click on any thumbnail to view the full-sized image.</p>

    <div class="gallery">
        <!-- Thumbnail 1 -->

            <img src="https://images.pexels.com/photos/56866/garden-rose-red-pink-56866.jpeg?cs=srgb&dl=pexels-pixabay-56866.jpg&fm=jpg" alt="Image 1 Thumbnail" />
        </a>
