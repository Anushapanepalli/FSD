<!DOCTYPE html>
<html>
<head>
    <title>JS Output Methods</title>
</head>
<body>
    <h2>Displaying Output</h2>
    <p id="output"></p>

    <script>
        alert("Alert Message!");
        document.write("Output using document.write()<br>");
        console.log("Output in console");
        document.getElementById("output").innerHTML = "Output using innerHTML";
    </script>
</body>
</html>
