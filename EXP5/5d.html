<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model Example</title>
    <style>
        .box {
            /* i. Content */
            width: 250px; 
            height: 100px;
            background-color: lightblue; 
            
            /* ii. Padding */
            padding: 20px; 

            /* iii. Border */
            border: 5px solid darkblue; 

            /* iv. Margin */
            margin: 30px auto; 

            /* Text styling */
            font-family: Arial, sans-serif;
            text-align: center;
            font-size: 18px;
        }

        body {
            background: #f8f8f8;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>CSS Box Model Demonstration</h1>

    <div class="box">
        This is the <b>Content</b> area.<br>
        (with Padding, Border & Margin applied)
    </div>
</body>
</html>
