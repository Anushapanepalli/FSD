<!DOCTYPE html>
<html>
<head>
    <title>CSS Font and Text Example</title>
    <style>
        /* i. font-size */
        .fontsize {
            font-size: 24px; /* large font size */
        }

        /* ii. font-weight */
        .fontweight {
            font-weight: bold; /* makes text bold */
        }

        /* iii. font-style */
        .fontstyle {
            font-style: italic; /* italic text */
        }

        /* iv. text-decoration */
        .decoration {
            text-decoration: underline; /* underline */
        }

        /* v. text-transform */
        .transform {
            text-transform: uppercase; /* convert text to uppercase */
        }

        /* vi. text-align */
        .alignment {
            text-align: center; /* center alignment */
        }

        /* Styling container */
        .box {
            background: #f0f0f0;
            margin: 10px auto;
            padding: 15px;
            width: 60%;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <h1 style="text-align:center;">CSS Font and Text Properties</h1>

    <div class="box fontsize">
        This text demonstrates <b>font-size</b>.
    </div>

    <div class="box fontweight">
        This text demonstrates <b>font-weight (bold)</b>.
    </div>

    <div class="box fontstyle">
        This text demonstrates <b>font-style (italic)</b>.
    </div>

    <div class="box decoration">
        This text demonstrates <b>text-decoration (underline)</b>.
    </div>

    <div class="box transform">
        This text demonstrates <b>text-transform (uppercase)</b>.
    </div>

    <div class="box alignment">
        This text demonstrates <b>text-align (center)</b>.
    </div>

</body>
</html>
