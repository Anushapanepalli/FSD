<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Working of Tables in HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 70%;
        }
        table, th, td {
            border: 2px solid black;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
        caption {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <h1>HTML Tables Example</h1>
    <p>This example demonstrates the use of the <code>&lt;table&gt;</code> tag with rows and columns, header cells, and the attributes <code>border</code>, <code>rowspan</code>, and <code>colspan</code>.</p>

    <table border="2">
        <caption>Sample Table with Rowspan and Colspan</caption>
        <tr>
            <th>Employee</th>
            <th colspan="2">Details</th>
            <th>Department</th>
        </tr>
        <tr>
            <td rowspan="2">Alice</td>
            <td>Age</td>
            <td>30</td>
            <td>Sales</td>
        </tr>
        <tr>
            <td>Location</td>
            <td>New York</td>
            <td>Sales</td>
        </tr>
        <tr>
            <td>Bob</td>
            <td>Age</td>
            <td>25</td>
            <td>Marketing</td>
        </tr>
    </table>

</body>
</html>
