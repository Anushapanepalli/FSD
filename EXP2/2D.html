<!DOCTYPE html>
<html>
<head>
    <title>Frames Example</title>
</head>

<frameset cols="33%,34%,33%">
    <frame src="frame1.html" name="frame1" noresize scrolling="no" />
    <frame src="frame2.html" name="frame2" noresize scrolling="auto" />
    <frame src="frame3.html" name="frame3" noresize scrolling="auto" />
    
    <noframes>
        <body>
            <h2>Sorry, your browser does not support frames.</h2>
            <p>This page requires a frames-capable browser.</p>
        </body>
    </noframes>
</frameset>

</html>
